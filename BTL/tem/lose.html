<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>⏳ Thua cuộc</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f85032, #e73827);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .fail-box {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #c0392b;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #2c3e50;
        }
        a {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="fail-box">
        <h1>⏰ HẾT GIỜ!</h1>
        <p>Bạn đã không giải mã kịp thời gian. Kho báu đã biến mất...</p>
        <a href="/">Thử lại từ đầu</a>
    </div>
</body>
</html>
