<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🎉 Chiến thắng</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .win-box {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 32px;
            color: #27ae60;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #2c3e50;
        }
        a {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="win-box">
        <h1>🎉 CHÚC MỪNG!</h1>
        <p>Bạn đã giải mã thành công tất cả các thông điệp và tìm được kho báu bí mật!</p>
        <a href="/">Chơi lại từ đầu</a>
    </div>
</body>
</html>
